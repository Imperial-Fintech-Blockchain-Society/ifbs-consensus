name: Consensus scheduled jobs
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        type: choice
        options: [resolve, monitor, digest]
permissions:
  contents: read
concurrency:
  group: consensus-jobs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SCHEDULE: ${{ github.event.schedule }}
      SELECTED_JOB: ${{ inputs.job }}
    steps:
      - name: Trigger authenticated jobs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set APP_URL and CRON_SECRET in the Production environment secrets."
            exit 1
          fi
          if [ -n "$SELECTED_JOB" ]; then
            jobs="$SELECTED_JOB"
          elif [ "$SCHEDULE" = "0 18 * * 0" ]; then
            jobs="digest"
          else
            jobs="resolve monitor"
          fi
          for job in $jobs; do
            url="${APP_URL%/}/api/cron/$job"
            response_file="$(mktemp)"

            echo "Calling $url"

            set +e
            http_code="$(
              curl \
                --silent \
                --show-error \
                --output "$response_file" \
                --write-out "%{http_code}" \
                --request POST \
                --header "Authorization: Bearer $CRON_SECRET" \
                --max-time 310 \
                "$url"
            )"
            curl_status=$?
            set -e

            echo "curl exit code: $curl_status"
            echo "HTTP status: $http_code"
            echo "Response body:"
            cat "$response_file"
            echo
            rm -f "$response_file"

            if [ "$curl_status" -ne 0 ] || [[ "$http_code" != 2* ]]; then
              echo "::error::Cron job '$job' failed"
              exit 1
            fi
          done
